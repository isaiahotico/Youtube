<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnRewards - Watch & Earn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        .hidden-section { display: none; }
        .active-tab { border-bottom: 3px solid #fbbf24; color: #fbbf24; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-20">

    <!-- Header / Balance -->
    <nav class="bg-gray-800 p-4 sticky top-0 z-50 shadow-lg border-b border-gray-700">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-yellow-500">PROPETAS <span class="text-white text-xs uppercase">Rewarder</span></h1>
            <div class="text-right">
                <p class="text-xs text-gray-400">Balance</p>
                <p class="text-lg font-mono font-bold text-green-400">₱ <span id="user-balance">0.000</span></p>
            </div>
        </div>
    </nav>

    <!-- Telegram User & Profile -->
    <div class="container mx-auto p-4">
        <div id="profile-section" class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
            <div class="flex items-center gap-4">
                <div class="bg-blue-500 p-3 rounded-full"><i class="fab fa-telegram-plane text-2xl"></i></div>
                <div>
                    <h2 class="font-bold text-lg" id="display-username text-blue-300">Loading Telegram...</h2>
                    <p class="text-xs text-gray-400">ID: <span id="user-uid">---</span></p>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex overflow-x-auto gap-4 mb-6 border-b border-gray-700 no-scrollbar">
            <button onclick="showTab('yt-watch')" class="tab-btn px-4 py-2 whitespace-nowrap active-tab" id="btn-yt-watch">YT Watch</button>
            <button onclick="showTab('yt-sub')" class="tab-btn px-4 py-2 whitespace-nowrap" id="btn-yt-sub">YT Sub</button>
            <button onclick="showTab('fb-follow')" class="tab-btn px-4 py-2 whitespace-nowrap" id="btn-fb-follow">FB Follow</button>
            <button onclick="showTab('web-visit')" class="tab-btn px-4 py-2 whitespace-nowrap" id="btn-web-visit">Website</button>            <button onclick="showTab('playstore')" class="tab-btn px-4 py-2 whitespace-nowrap" id="btn-playstore">PlayStore</button>
            <button onclick="showTab('add-link')" class="tab-btn px-4 py-2 whitespace-nowrap bg-yellow-600 rounded-t-lg" id="btn-add">Add Link</button>
        </div>

        <!-- Content Area -->
        <div id="task-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Tasks will be injected here by app.js -->
        </div>

        <!-- Admin Access -->
        <div class="mt-10 p-4 border border-dashed border-gray-600 rounded text-center">
            <button onclick="openAdmin()" class="text-gray-500 text-xs hover:text-white">Admin Access</button>
        </div>

        <!-- Coffee Support -->
        <div class="mt-6 text-center">
            <a href="https://paypal.me/otico.isai2@gmail.com" target="_blank" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-full text-sm transition">
                <i class="fas fa-coffee"></i> Buy Admin Coffee
            </a>
        </div>
    </div>

    <!-- Modals -->
    <!-- Timer Overlay -->
    <div id="timer-modal" class="fixed inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center z-[100] hidden">
        <div class="text-center">
            <h2 class="text-2xl mb-4" id="modal-task-title">Watching Video...</h2>
            <div class="relative w-32 h-32 mx-auto">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" stroke="#374151" stroke-width="5" fill="none" />
                    <circle id="timer-progress" cx="50" cy="50" r="45" stroke="#fbbf24" stroke-width="5" fill="none" stroke-dasharray="283" stroke-dashoffset="283" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="countdown-text" class="text-3xl font-bold font-mono text-yellow-500">30</span>
                </div>
            </div>
            <p class="mt-4 text-gray-400">Do not close this page to receive reward</p>
        </div>
    </div>

    <!-- Post Link Modal -->
    <div id="link-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-gray-800 w-full max-w-md p-6 rounded-xl border border-gray-700">
            <h2 class="text-xl font-bold mb-4">Add Your Link</h2>
            <select id="link-type" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mb-3">
                <option value="yt-watch">YouTube Watch (₱5 - 550 clicks)</option>
                <option value="yt-sub">YouTube Subscribe (₱5 - 260 clicks)</option>
                <option value="fb-follow">FB Follow (₱5 - 550 clicks)</option>
                <option value="web-visit">Website Visit (₱5 - 550 clicks)</option>
                <option value="playstore">PlayStore Visit (₱5 - 550 clicks)</option>
            </select>
            <input type="url" id="link-url" placeholder="https://..." class="w-full bg-gray-900 border border-gray-700 p-2 rounded mb-4">
            <div class="flex gap-2">
                <button onclick="closeModals()" class="flex-1 bg-gray-700 py-2 rounded">Cancel</button>
                <button onclick="submitLink()" class="flex-1 bg-yellow-600 py-2 rounded">Pay ₱5 & Post</button>
            </div>
        </div>
    </div>

    <!-- Ads Library (libtl) -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script type="module" src="app.js"></script>
</body>
</html>
